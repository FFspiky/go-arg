name: Validate strict subcommands
on:
  push:
    branches: [ci/strict-subcommand-validation]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ['1.25', '1.26', '1.27']
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 1cd23d8dfb35f122bc167430590c84ede75672f5
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
      - name: Verify source and toolchain
        run: |
          test "$(git rev-parse HEAD)" = "1cd23d8dfb35f122bc167430590c84ede75672f5"
          go version
      - run: go test -race -count=1 ./...
      - run: go vet ./...
      - run: go build ./...
